- id: theme-dark-token-mismatch
  title: 'fsbrowse index.html sets data-theme=dark|light from localStorage, but the kit only defines dark tokens under [data-theme=ink] and [data-theme=auto]. So ''dark'' yields NO dark tokens — file browser stays light in dark mode. Reconcile: either map dark->ink in kit, or have fsbrowse emit ink/auto. Decide and fix.'
  witness: 'browser-6: body backgroundColor=rgb(19,19,24)=--ink, i.e. dark tokens ARE applying. Fixed by adding [data-theme=dark] alias to the ink dark-token block in colors_and_type.css; rebuilt dist (grep data-theme=dark in dist confirmed).'
  status: completed
